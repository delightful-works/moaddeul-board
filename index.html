function editProfile(){if(!user)return auth();popup('사용자 정보',`<label>이메일</label><input type="email" value="${safe(user.email||'')}" disabled><label for="nickname">닉네임</label><input id="nickname" name="nickname" required minlength="2" maxlength="20" autocomplete="nickname" value="${safe(myNickname())}"><p class="muted">닉네임은 게시물과 댓글에 공개됩니다. 2~20자로 입력하세요.</p><div class="row" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line)"><button type="button" id="changePassword">비밀번호 변경</button><button type="button" id="deleteAccount" class="danger">계정 삭제</button></div>`,async f=>{const nickname=validateNickname(f.get('nickname'));const {data,error:e}=await api.auth.updateUser({data:{nickname}});if(e)throw e;user=data.user;authorProfiles.set(user.id,nickname);renderUser();if(current&&selected)await loadPosts()});$('changePassword').onclick=()=>openAccountDialog(changePassword);$('deleteAccount').onclick=()=>openAccountDialog(deleteAccount)}

popup('비밀번호 변경','<label for="currentPassword">현재 비밀번호</label><input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password"><label for="newPassword">새 비밀번호</label><input id="newPassword" name="newPassword" type="password" minlength="8" required autocomplete="new-password"><label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"><p class="muted">새 비밀번호는 8자 이상 입력하세요.</p><div id="passwordReauth" hidden><p>추가 인증이 필요합니다. 이메일로 받은 인증 코드를 입력하세요.</p><button type="button" id="sendPasswordCode">인증 코드 보내기</button><label for="passwordNonce">인증 코드</label><input id="passwordNonce" name="nonce" autocomplete="one-time-code"></div>',async f=>{const password=String(f.get('newPassword')||'');if(password.length<8)throw new Error('새 비밀번호는 8자 이상 입력하세요.');if(password!==f.get('confirmPassword'))throw new Error('새 비밀번호가 일치하지 않습니다.');if(password===f.get('currentPassword'))throw new Error('현재 비밀번호와 다른 비밀번호를 입력하세요.');const id=user.id;const {data:verified,error:ve}=await api.auth.signInWithPassword({email:user.email,password:f.get('currentPassword')});if(ve)throw ve;if(verified.user?.id!==id)throw new Error('로그인 정보를 다시 확인하세요.');const attributes={password};const nonce=String(f.get('nonce')||'').trim();if(nonce)attributes.nonce=nonce;const {data,error:e}=await api.auth.updateUser(attributes);if(e){if(['reauthentication_needed','reauthentication_not_valid'].includes(e.code))$('passwordReauth').hidden=false;throw e}user=data.user;renderUser();$('notice').textContent='비밀번호를 변경했습니다.'});

function deleteAccount(){if(!user)return auth();popup('계정 영구 삭제','<p><strong>계정을 삭제하면 복구할 수 없습니다.</strong></p><ul><li>내 보드와 그 안의 모든 탭·게시물·댓글·좋아요가 삭제됩니다. 다른 사람이 내 보드에 남긴 내용도 포함됩니다.</li><li>다른 보드에 내가 작성한 게시물·댓글·좋아요와 내 닉네임도 삭제됩니다.</li><li>GitHub 계정과 외부 링크의 원본 파일은 삭제되지 않습니다.</li></ul><label><input type="checkbox" name="consent" required style="width:auto"> 삭제 범위를 확인했습니다.</label><label for="deleteConfirmation">계정 삭제를 직접 입력하세요</label><input id="deleteConfirmation" name="confirmation" required autocomplete="off">',async f=>{if(!f.has('consent')||f.get('confirmation')!=='계정 삭제')throw new Error('삭제 범위를 확인하고 계정 삭제를 정확히 입력하세요.');accountDeletionInProgress=true;try{const {error:e}=await api.rpc('moatteul_delete_my_account',{confirmation:'DELETE'});if(e){if(['PGRST202','42883'].includes(e.code))throw new Error('계정 삭제 DB 설정이 필요합니다. Supabase SQL Editor에서 supabase_account_delete.sql을 실행하세요.');throw e}try{await api.auth.signOut({scope:'local'})}catch(e){}++authLoadVersion;++boardLoadVersion;user=null;boards=[];tabs=[];postCache=[];current=null;selected=null;authorProfiles.clear();$('boards').innerHTML='';$('content').innerHTML='';$('contextMenu').hidden=true;const url=new URL(location.href);url.searchParams.delete('board');url.hash='';history.replaceState(null,'',url);renderUser();await loadBoards();$('notice').textContent='계정과 관련 데이터를 삭제했습니다.'}finally{accountDeletionInProgress=false}});$('form').querySelector('button.primary').classList.add('danger')}

async function loadAuthorProfiles(ids){const unique=[...new Set(ids.filter(Boolean))];if(!unique.length)return null;try{for(let i=0;i<unique.length;i+=100){const {data,error:e}=await api.from('moatteul_profiles').select('id,nickname').in('id',unique.slice(i,i+100));if(e)throw e;unique.slice(i,i+100).forEach(id=>authorProfiles.delete(id));for(const p of data||[]){if(p.nickname)authorProfiles.set(p.id,p.nickname)}}return null}catch(e){return '작성자 닉네임을 불러오지 못했습니다: '+(e?.message||String(e))}}let boardLoadVersion=0,authLoadVersion=0;
async function init(){if(accountDeletionInProgress)return;const version=++authLoadVersion;let {data,error:e}=await api.auth.getUser();if(version!==authLoadVersion)return;const nextUser=data?.user||null;if(user?.id!==nextUser?.id){boards=[];tabs=[];postCache=[];current=null;selected=null;authorProfiles.clear();$('boards').innerHTML='';$('content').innerHTML='';}user=nextUser;renderUser();await loadBoards()}
$('login').onclick=async()=>{if(user){const {error:e}=await api.auth.signOut();if(e)return error(e);++authLoadVersion;user=null;boards=[];tabs=[];postCache=[];current=null;selected=null;authorProfiles.clear();$('boards').innerHTML='';$('content').innerHTML='';$('contextMenu').hidden=true;if($('dlg').open)$('dlg').close();renderUser();await loadBoards()}else auth()};$('newBoard').onclick=()=>{if(!user)return auth();popup('보드 만들기',input('title','보드 이름'),async f=>{let {data,error:e}=await api.from('boards').insert({title:f.get('title'),owner_id:user.id}).select().single();if(e)throw e;let {error:te}=await api.from('board_tabs').insert({board_id:data.id,title:'게시판 1'});if(te)throw te;current=data.id;await loadBoards();window.open(location.pathname+'?board='+encodeURIComponent(data.id),'_blank','noopener')})};async function loadBoards(){
const version=++boardLoadVersion;const viewer=user?.id||null;const requested=new URLSearchParams(location.search).get('board');
boards=[];$('boards').innerHTML='';$('notice').textContent='';
if(!requested){document.body.classList.remove('board-view');$('homeView').hidden=false;$('boardView').hidden=true;$('content').innerHTML='';if(!viewer){current=null;selected=null;$('status').textContent='';$('boards').innerHTML='<div class="empty">로그인하면 나의 보드를 볼 수 있습니다.</div>';return}}
let query=api.from('boards').select('*');query=requested?query.eq('id',requested):query.eq('owner_id',viewer);
let {data,error:e}=await query.order('created_at',{ascending:false});if(version!==boardLoadVersion||viewer!==(user?.id||null))return;if(e)return error(e);
boards=(data||[]).filter(b=>requested?b.id===requested:b.owner_id===viewer);if(!boards.some(b=>b.id===current))current=null;
if(requested){current=requested;document.body.classList.add('board-view');$('homeView').hidden=true;$('boardView').hidden=false;await loadTabs();return}
$('status').textContent='';$('boards').innerHTML=boards.map(b=>`<article class="board-tile"><div class="tile-art"><span>▤</span></div><div class="tile-info"><strong>${safe(b.title)}</strong><span class="muted">${b.is_public?'공개 보드':'비공개 보드'}</span></div><button class="tile-open" data-b="${b.id}">열기 ↗</button><div class="board-tools">${boardToolButtons(b)}</div></article>`).join('')||'<div class="empty">아직 보드가 없습니다. 첫 번째 보드를 만들어 보세요.</div>';
bindBoardTools();document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>window.open(location.pathname+'?board='+encodeURIComponent(x.dataset.b),'_blank','noopener'));}async function loadTabs(){if(!current){$('content').innerHTML='<div class="card">아직 보드가 없습니다.</div>';return}let b=boards.find(x=>x.id===current);if(!b){$('content').innerHTML='<div class=empty>접근할 수 없는 보드입니다.</div>';return}let own=b.owner_id===user?.id;let {data,error:e}=await api.from('board_tabs').select('*').eq('board_id',current).order('position');if(e)return error(e);tabs=data||[];if(!tabs.some(t=>t.id===selected))selected=tabs[0]?.id||null;$('content').innerHTML=`<div class="row between"><h2>${safe(b.title)}</h2><span class="muted">${b.is_public?'공개':'비공개'}</span></div><div class="tabs" id="tabBtns"></div><div class="row" id="actions">${boardToolButtons(b)}</div><div id="posts"></div>`;bindBoardTools();$('tabBtns').innerHTML=tabs.map(t=>`<button data-t="${t.id}" class="${t.id===selected?'active':''}">${safe(t.title)}</button>`).join('')+(own?'<button id="addTab">+ 탭</button>':'');document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{selected=x.dataset.t;loadTabs()});if(own){$('addTab').onclick=()=>popup('게시판 탭 추가',input('title','탭 이름')+'<label>형식</label><select name="layout"><option value="free">자유형</option><option value="group">그룹형</option></select><label><input style="width:auto" type="checkbox" name="approval"> 승인 후 공개</label>',async f=>{let {error:e}=await api.from('board_tabs').insert({board_id:current,title:f.get('title'),layout:f.get('layout'),approval_required:f.has('approval'),position:tabs.length});if(e)throw e;await loadTabs()});let toggle=document.createElement('button');toggle.textContent=b.is_public?'비공개로 변경':'공개로 변경';toggle.onclick=async()=>{let {error:e}=await api.from('boards').update({is_public:!b.is_public}).eq('id',b.id);if(e)error(e);else loadBoards()};$('actions').append(toggle);if(selected){let rename=document.createElement('button');rename.textContent='탭 이름 변경';rename.onclick=()=>editTab(tabs.find(t=>t.id===selected));$('actions').append(rename)}}if(selected){let btn=document.createElement('button');btn.className='primary';btn.textContent='+ 게시물';btn.onclick=addPost;$('actions').append(btn);await loadPosts();bindMenus()}}function addPost(){if(!user)return auth();if(!myNickname())return editProfile();const targetTab=selected;const t=tabs.find(t=>t.id===targetTab);if(!t)return error(new Error('게시물을 작성할 탭을 선택하세요.'));popup('게시물 작성',input('title','제목',false)+'<label>내용</label><textarea name="body" required></textarea><label>외부 링크 (선택)</label><input type="url" name="url"><p class="muted">사진·동영상·파일은 Google Drive나 GitHub 링크로 공유하세요.</p>',async f=>{let body=String(f.get('body')||'').trim();if(!body)throw new Error('내용을 입력하세요.');let {error:e}=await api.from('posts').insert({tab_id:targetTab,author_id:user.id,title:String(f.get('title')||'').trim(),body,url:f.get('url')||null,approved:!t.approval_required});if(e)throw e;if(selected===targetTab)await loadPosts()})}async function loadPosts(){
let {data,error:e}=await api.from('posts').select('*').eq('tab_id',selected).order('created_at',{ascending:false}).order('id',{ascending:false});if(e)return error(e);postCache=data||[];
let ids=postCache.map(p=>p.id),likes=[],comments=[],likesReady=true,commentsReady=true;const socialErrors=[];
if(ids.length){let [lr,cr]=await Promise.all([api.from('post_likes').select('post_id,user_id').in('post_id',ids),api.from('post_comments').select('id,post_id,author_id,body,created_at').in('post_id',ids).order('created_at',{ascending:true})]);likesReady=!lr.error;commentsReady=!cr.error;if(lr.error)socialErrors.push('\uC88B\uC544\uC694\uB97C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4: '+lr.error.message);if(cr.error)socialErrors.push('\uB313\uAE00\uC744 \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4: '+cr.error.message);likes=lr.data||[];comments=cr.data||[]}
const profileError=await loadAuthorProfiles([...postCache.map(p=>p.author_id),...comments.map(c=>c.author_id)]);if(profileError)socialErrors.push(profileError);let own=boards.find(b=>b.id===current)?.owner_id===user?.id;
$('posts').innerHTML=`<div class="grid">${postCache.map(p=>{let ls=likes.filter(x=>x.post_id===p.id),cs=comments.filter(x=>x.post_id===p.id);return `<article class="card post-card" data-post="${p.id}"><div class="row between"><span class="muted">${new Date(p.created_at).toLocaleDateString('ko-KR')}</span><span class="muted">${p.approved?'공개':'승인 대기'}</span></div><p class="muted post-author">작성자 · ${safe(authorName(p.author_id))}</p>${p.title?`<h3>${safe(p.title)}</h3>`:''}<p style="white-space:pre-wrap">${safe(p.body)}</p>${p.url&&/^https?:\/\//i.test(p.url)?`<a target="_blank" rel="noopener noreferrer" href="${safe(p.url)}">링크 열기 ↗</a>`:''}<div class="post-actions"><button class="like-btn ${ls.some(x=>x.user_id===user?.id)?'liked':''}" data-like="${p.id}" aria-pressed="${ls.some(x=>x.user_id===user?.id)}" ${likesReady?'':'disabled'}>${ls.some(x=>x.user_id===user?.id)?'&#9829;':'&#9825;'} 좋아요 ${likesReady?ls.length:'—'}</button><button data-comment="${p.id}" ${commentsReady?'':'disabled'}>댓글 ${commentsReady?cs.length:'—'}</button>${!p.approved&&own?`<button data-approve="${p.id}">승인</button>`:''}</div>${cs.length?`<div class="comments">${cs.map(c=>`<p style="white-space:pre-wrap"><strong>${safe(authorName(c.author_id))}</strong><br>${safe(c.body)}</p>`).join('')}</div>`:''}<span class="muted hint">수정·삭제는 마우스 오른쪽 버튼</span></article>`}).join('')||'<div class="empty">아직 게시물이 없습니다.</div>'}</div>`;
if(socialErrors.length)error(new Error(socialErrors.join('\n')+'\nDB 테이블과 접근 권한을 확인하세요.'));else $('status').textContent='';document.querySelectorAll('[data-like]').forEach(x=>x.onclick=async()=>{x.disabled=true;try{await toggleLike(postCache.find(p=>p.id===x.dataset.like))}catch(e){error(e)}finally{x.disabled=false}});document.querySelectorAll('[data-comment]').forEach(x=>x.onclick=()=>addComment(postCache.find(p=>p.id===x.dataset.comment)));document.querySelectorAll('[data-approve]').forEach(x=>x.onclick=async()=>{let {error:e}=await api.from('posts').update({approved:true}).eq('id',x.dataset.approve);if(e)error(e);else loadPosts()});bindMenus()}
// Additional interaction for posts and tabs.
let postCache=[];
function menuAt(e,items){e.preventDefault();let m=$('contextMenu');m.innerHTML='';items.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{m.hidden=true;fn()};m.append(b)});if(!items.length)return;m.hidden=false;m.style.left=Math.min(e.clientX,innerWidth-190)+'px';m.style.top=Math.min(e.clientY,innerHeight-110)+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('#contextMenu'))$('contextMenu').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('contextMenu').hidden=true});
async function editTab(t){popup('게시판 이름 변경',`<label>게시판 이름</label><input name="title" required value="${safe(t.title)}">`,async f=>{if(!String(f.get('title')||'').trim())throw new Error('탭 이름을 입력하세요.');let {error:e}=await api.from('board_tabs').update({title:String(f.get('title')||'').trim()}).eq('id',t.id).select('id').single();if(e)throw e;await loadTabs()})}
async function removeTab(t){if(!confirm('이 게시판과 게시물이 모두 삭제됩니다. 계속할까요?'))return;let {error:e}=await api.from('board_tabs').delete().eq('id',t.id);if(e)return error(e);selected=null;await loadTabs()}
function editPost(p){popup('게시물 수정',`<label>제목</label><input name="title" value="${safe(p.title)}"><label>내용</label><textarea name="body" required>${safe(p.body)}</textarea><label>외부 링크</label><input name="url" type="url" value="${safe(p.url||'')}">`,async f=>{let {error:e}=await api.from('posts').update({title:f.get('title'),body:f.get('body'),url:f.get('url')||null}).eq('id',p.id);if(e)throw e;await loadPosts()})}
async function removePost(p){if(!confirm('게시물을 삭제할까요?'))return;let {error:e}=await api.from('posts').delete().eq('id',p.id);if(e)return error(e);await loadPosts()}
async function toggleLike(p){if(!user)return auth();let {data,error:e}=await api.from('post_likes').select('user_id').eq('post_id',p.id).eq('user_id',user.id);if(e)return error(e);let q=data?.length?api.from('post_likes').delete().eq('post_id',p.id).eq('user_id',user.id):api.from('post_likes').insert({post_id:p.id,user_id:user.id});let r=await q;if(r.error)return error(r.error);await loadPosts()}
function addComment(p){if(!user)return auth();if(!myNickname())return editProfile();popup('댓글 작성',`<label>댓글</label><textarea name="body" required></textarea>`,async f=>{let body=String(f.get('body')||'').trim();if(!body)throw new Error('내용을 입력하세요.');let {error:e}=await api.from('post_comments').insert({post_id:p.id,author_id:user.id,body});if(e)throw e;await loadPosts()})}
function bindMenus(){let b=boards.find(x=>x.id===current),own=b?.owner_id===user?.id;document.querySelectorAll('[data-t]').forEach(el=>{let t=tabs.find(t=>t.id===el.dataset.t);if(own&&t)el.oncontextmenu=e=>menuAt(e,[['이름 변경',()=>editTab(t)],['게시판 삭제',()=>removeTab(t)]])});document.querySelectorAll('[data-post]').forEach(el=>{let p=postCache.find(p=>p.id===el.dataset.post);if(!p)return;el.oncontextmenu=e=>{let allowed=user&&(p.author_id===user.id||own);menuAt(e,allowed?[['게시물 수정',()=>editPost(p)],['게시물 삭제',()=>removePost(p)]]:[])}})}
api.auth.onAuthStateChange(()=>setTimeout(init,0));init();
</script></body></html>
